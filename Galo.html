<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Nuestra Historia 🐺🌙</title>

<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at top, #1c1c2e, #0f0f1a 70%);
    font-family: "Georgia", serif;
    color: white;
}

/* 🌌 Stars */
.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; }
    to { opacity: 1; }
}

/* 🌙 Moon glow */
.moon {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #ddd 40%, transparent 70%);
    box-shadow: 0 0 60px 25px rgba(255,255,255,0.2);
    animation: glow 4s ease-in-out infinite alternate;
}

@keyframes glow {
    from { box-shadow: 0 0 50px 20px rgba(255,255,255,0.15); }
    to { box-shadow: 0 0 80px 35px rgba(255,255,255,0.25); }
}

/* 🐺 Wolf silhouette */
.wolf {
    position: absolute;
    bottom: 0;
    left: 40px;
    width: 250px;
    opacity: 0.08;
}

/* Card */
.card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(12px);
    padding: 60px 70px;
    border-radius: 25px;
    text-align: center;
    width: 80%;
    max-width: 650px;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

/* Fade transition */
.fade {
    animation: fadeIn 1s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

h1, h2 {
    margin-bottom: 25px;
}

.message {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 35px;
}

button {
    padding: 14px 35px;
    border-radius: 40px;
    border: none;
    background: linear-gradient(45deg, #ff4d6d, #ff758f);
    color: white;
    font-size: 17px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.08);
}
</style>
</head>

<body>

<div class="stars" id="stars"></div>
<div class="moon"></div>

<!-- Use any wolf PNG silhouette here -->
<img src="wolf.png" class="wolf">

<audio id="bgMusic" src="mystic.mp3" loop></audio>

<div class="card fade">
    <div id="content"></div>
</div>

<script>
const content = document.getElementById("content");
const music = document.getElementById("bgMusic");

/* 🌌 Generate Stars */
for (let i = 0; i < 120; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDuration = (1 + Math.random() * 3) + "s";
    document.getElementById("stars").appendChild(star);
}

/* 🎵 Start mystical music on first interaction */
document.addEventListener("click", () => {
    music.volume = 0.25;
    music.play().catch(()=>{});
}, { once: true });

function changeScreen(html) {
    content.classList.remove("fade");
    void content.offsetWidth;
    content.innerHTML = html;
    content.classList.add("fade");
}

renderScreen1();

function renderScreen1() {
    changeScreen(`
        <h1>Isa… dicen que los lobos no aúllan sin razón. 🐺🌙</h1>
        <button onclick="why()">¿Por qué?</button>
        <button onclick="tell()">Cuéntame.</button>
    `);
}

function why() {
    changeScreen(`
        <p class="message">
        Porque cuando un lobo reconoce a su luna,
        entiende que el silencio ya no es suficiente.
        </p>
        <button onclick="renderScreen2()">Seguir…</button>
    `);
}

function tell() {
    changeScreen(`
        <p class="message">
        Porque hay lunas que merecen ser miradas sin miedo
        y nombradas en voz alta.
        </p>
        <button onclick="renderScreen2()">Seguir…</button>
    `);
}

function renderScreen2() {
    changeScreen(`
        <h2>El secreto del lobo 🐺</h2>
        <p class="message">
        Hay lobos que caminan en silencio…
        pero cuando encuentran su luna,
        empiezan a aullar con el corazón.
        </p>
        <button onclick="renderScreen3()">Continuar…</button>
    `);
}

function renderScreen3() {
    changeScreen(`
        <h2>El viaje del caballero ⚔️</h2>
        <p class="message">
        Todo caballero atraviesa tormentas…
        hasta que su musa asturiana le recuerda
        hacia dónde late su destino.
        </p>
        <button onclick="renderScreen4()">Seguir…</button>
    `);
}

function renderScreen4() {
    changeScreen(`
        <h2>La princesa Atenea 👑</h2>
        <p class="message">
        Porque incluso en la distancia,
        el caballero y su princesa Atenea
        ya están escribiendo una historia
        que merece celebrarse.
        </p>
        <button onclick="renderScreen5()">Un paso más…</button>
    `);
}

function renderScreen5() {
    changeScreen(`
        <h2>Nuestra leyenda ✨</h2>
        <p class="message">
        Feliz San Valentín, Isa ❤️<br><br>
        El lobo ya está en camino hacia su luna… 🌙<br>
        y pronto celebraremos nuestra historia juntos.
        </p>
    `);
}
</script>

</body>
</html>
